<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfriCuisine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Forum&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8faf7;
      --paper: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --accent: #6aa84f;
      --accent-soft: #d9ead3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, var(--accent-soft), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #e8f0e6, transparent 50%),
        var(--bg);
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 3rem;
    }
    h1 {
      font-family: Forum, serif;
      font-weight: 400;
      font-size: clamp(2.6rem, 6vw, 3.6rem);
      line-height: 1.1;
      margin: 0 0 0.75rem;
    }
    .lede {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
      margin: 0 0 2rem;
      min-height: 1.5em;
    }
    .links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
    }
    a.cta {
      display: inline-block;
      padding: 0.7rem 1.15rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 0.35rem;
    }
    a.cta:hover { filter: brightness(0.95); }
    a.cta.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <h1>AfriCuisine</h1>
    <p class="lede"></p>
    <div class="links">
      <a class="cta" href="./Ethnocultural-groups/">Ethnocultural groups analysis</a>
      <a class="cta secondary" href="./Regions/">Regions analysis</a>
    </div>
  </main>
</body>
</html>
