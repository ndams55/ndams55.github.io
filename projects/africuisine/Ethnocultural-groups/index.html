<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AfriCuisine — Groupes ethnoculturels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Forum&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8faf7;
      --paper: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --accent: #6aa84f;
      --accent-soft: #d9ead3;
      --bar: #6aa84f;
      --track: #eef2ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "DM Sans", "Helvetica Neue", Arial, sans-serif;
    }
    main { max-width: 1240px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-size: 2.4rem; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 8px; }
    h2 { font-size: 1.25rem; font-weight: 600; margin: 0 0 12px; }
    p { margin: 0; }
    .lede { color: var(--muted); max-width: 68ch; }
    .lede mark { background: var(--accent-soft); color: var(--ink); font-weight: 600; padding: 0 0.25em; white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 28px 0; }
    .stat { background: var(--paper); border: 1px solid var(--line); padding: 14px 16px; }
    .stat b { display: block; font-family: Forum, Georgia, serif; font-weight: 400; font-size: 2.4rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 0.85rem; }
    section { margin-top: 36px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--muted); }
    select, input[type="search"] {
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 8px 10px;
      min-width: 220px;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
    button.pill {
      font: inherit;
      font-size: 0.9rem;
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 6px 10px;
      cursor: pointer;
      color: var(--ink);
    }
    button.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    table { width: 100%; border-collapse: collapse; background: var(--paper); font-size: 0.95rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr:hover td { background: var(--accent-soft); }
    thead th { background: var(--accent-soft); }
    .bar-cell { width: 28%; }
    .bar { height: 8px; background: var(--bar); }
    .caption { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    .scroll { overflow-x: auto; border: 1px solid var(--line); }
    .rules-scroll { overflow: auto; border: 1px solid var(--line); }
    .rules-scroll thead th { position: sticky; top: 0; background: var(--accent-soft); z-index: 1; }
    .compare-scroll { margin-top: 12px; }
    .share-chart { margin: 0; background: var(--paper); border: 1px solid var(--line); padding: 14px 16px 10px; }
    .hist { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 8px; }
    .hist-y { display: flex; flex-direction: column; justify-content: space-between; height: 220px; margin-top: 1.1rem; color: var(--muted); font-size: 0.75rem; text-align: right; }
    .hist-scroll { overflow-x: auto; }
    .hist-bars { display: flex; align-items: flex-start; gap: 4px; min-width: 720px; }
    .hist-col { flex: 1 0 0; display: flex; flex-direction: column; align-items: center; min-width: 0; }
    .hist-value { height: 1.1rem; font-size: 0.7rem; line-height: 1.1rem; font-variant-numeric: tabular-nums; }
    .hist-track { height: 220px; width: 70%; max-width: 28px; background: var(--track); display: flex; align-items: flex-end; box-shadow: 0 1px 0 var(--line); }
    .hist-fill { display: block; width: 100%; background: var(--bar); }
    .hist-name { margin-top: 6px; height: 5.6rem; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 0.72rem; white-space: nowrap; }
    .pie-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
    .pie-row svg { width: min(240px, 100%); height: auto; flex: none; }
    .pie-legend { list-style: none; margin: 0; padding: 0; }
    .group-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; align-items: start; }
    .group-card { background: var(--paper); border: 1px solid var(--line); padding: 12px 14px 10px; }
    .group-card h3 { margin: 0 0 10px; font-size: 1rem; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .group-card h3 span { color: var(--muted); font-weight: 400; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .gbar { margin: 7px 0 0; }
    .gbar-top { display: flex; justify-content: space-between; gap: 10px; font-size: 0.88rem; }
    .gbar-top b { font-variant-numeric: tabular-nums; font-weight: 600; }
    .gbar-track { display: block; height: 8px; margin-top: 3px; background: var(--track); }
    .gbar-fill { display: block; height: 100%; background: var(--bar); }
    .pie-legend li { display: flex; gap: 10px; align-items: baseline; margin: 10px 0; }
    .swatch { width: 0.85rem; height: 0.85rem; flex: none; transform: translateY(0.1rem); }
    .top { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
    .lang { display: flex; gap: 8px; flex: none; }
    @media (max-width: 800px) {
      .stats { grid-template-columns: 1fr 1fr; }
      h1 { font-size: 1.6rem; }
      .bar-cell { display: none; }
      .top { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1 id="title"></h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" class="pill" id="lang-fr">Français</button>
        <button type="button" class="pill" id="lang-en">English</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>

    <section id="rules-section">
      <h2 id="rules-title"></h2>
      <div class="rules-scroll" id="rules-wrap"><table id="rules"></table></div>
      <p class="caption" id="rules-caption"></p>
    </section>

    <section>
      <h2 id="detail-title"></h2>
      <div class="controls">
        <label><span id="country-label"></span><br><select id="country"></select></label>
        <label><span id="query-label"></span><br><input id="query" type="search"></label>
      </div>
      <div class="pills" id="files"></div>
      <p class="caption" id="selection-meta"></p>
      <div class="scroll"><table id="groups"></table></div>
    </section>

    <section>
      <h2 id="compare-title"></h2>
      <p class="lede" id="compare-lede"></p>
      <div class="scroll compare-scroll"><table id="overview"></table></div>
    </section>

    <section>
      <h2 id="pie-title"></h2>
      <p class="lede" id="pie-lede"></p>
      <figure class="share-chart">
        <div class="pie-row">
          <svg id="pie" viewBox="0 0 32 32" role="img"></svg>
          <ul class="pie-legend" id="pie-legend"></ul>
        </div>
      </figure>
    </section>

    <section>
      <h2 id="distinct-title"></h2>
      <p class="lede" id="distinct-lede"></p>
      <figure class="share-chart">
        <div id="distinct-chart"></div>
        <p class="caption" id="distinct-caption"></p>
      </figure>
      <p class="caption" id="single-scale"></p>
      <div class="group-board" id="single-groups"></div>
      <p class="caption" id="single-note"></p>
    </section>
  </main>

      function piePath(start, end) {
        const angle = (value) => (value / pieTotal) * Math.PI * 2 - Math.PI / 2;
        const point = (value) => [16 + 15.2 * Math.cos(angle(value)), 16 + 15.2 * Math.sin(angle(value))];
        const [x0, y0] = point(start);
        const [x1, y1] = point(end);
        const large = end - start > pieTotal / 2 ? 1 : 0;
        return `M 16 16 L ${x0} ${y0} A 15.2 15.2 0 ${large} 1 ${x1} ${y1} Z`;
      }
      let pieCursor = 0;
      document.querySelector("#pie").innerHTML = pieSlices.map((slice) => {
        const start = pieCursor;
        pieCursor += slice.count;
        return `<path d="${piePath(start, pieCursor)}" fill="${slice.color}"><title>${slice.label}: ${slice.count}</title></path>`;
      }).join("");
      document.querySelector("#pie").setAttribute("aria-label", pieSlices.map((slice) => `${slice.label} ${slice.count}`).join(", "));
      document.querySelector("#pie-legend").innerHTML = pieSlices.map((slice) => {
        const share = Math.round((100 * slice.count) / pieTotal);
        return `<li><span class="swatch" style="background:${slice.color}"></span><span><b>${slice.label}</b><br>${slice.count} · ${share}%</span></li>`;
      }).join("");
      document.querySelector("#distinct-title").textContent = copy.distinctTitle;
      document.querySelector("#distinct-lede").textContent = copy.distinctLede;
      document.querySelector("#distinct-caption").textContent = copy.distinctCaption(distinctTotal);
      document.querySelector("#single-scale").textContent = copy.singleScale;
      document.querySelector("#single-note").textContent = copy.singleNote;
      const parsedGroups = SINGLE_GROUPS.map((row) => ({
        ...row,
        items: row.groups.split(" ; ").map((part) => {
          const match = part.match(/^(.*) (\d+)$/);
          return { name: match[1], dishes: Number(match[2]) };
        }).sort((a, b) => b.dishes - a.dishes || a.name.localeCompare(b.name, lang)),
      }));
      const dishMax = Math.max(...parsedGroups.flatMap((row) => row.items.map((item) => item.dishes)));
      const esc = (value) => value.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      document.querySelector("#single-groups").innerHTML = parsedGroups.map((row) => {
        const country = COUNTRIES.find((entry) => entry.id === row.id);
        const name = country ? displayCountry(country) : row.id;
        const lines = row.items.map((item) => {
          const width = Math.max(4, Math.round((100 * item.dishes) / dishMax));
          return `<div class="gbar"><div class="gbar-top"><span>${esc(item.name)}</span><b>${item.dishes}</b></div><span class="gbar-track"><span class="gbar-fill" style="width:${width}%"></span></span></div>`;
        }).join("");
        return `<article class="group-card"><h3>${esc(name)}<span>${copy.singleDishes(row.dishes)}</span></h3>${lines}</article>`;
      }).join("");
      const byLabels = [...SINGLE_GROUPS].sort((a, b) => b.count - a.count || a.id.localeCompare(b.id));
      const axisMax = Math.max(10, Math.ceil(Math.max(...byLabels.map((item) => item.count)) / 10) * 10);
      const bars = byLabels.map((item) => {
        const country = COUNTRIES.find((entry) => entry.id === item.id);
        const name = country ? displayCountry(country) : item.id;
        const height = Math.round((100 * item.count) / axisMax);
        return `<div class="hist-col"><span class="hist-value">${item.count}</span><span class="hist-track"><span class="hist-fill" style="height:${height}%"></span></span><span class="hist-name">${name}</span></div>`;
      }).join("");
      document.querySelector("#distinct-chart").innerHTML = `<div class="hist"><div class="hist-y" aria-hidden="true"><span>${axisMax}</span><span>${axisMax / 2}</span><span>0</span></div><div class="hist-scroll"><div class="hist-bars">${bars}</div></div></div>`;
      document.querySelector("#rules-section").hidden = RULES.length === 0;
      document.querySelector("#rules-title").textContent = copy.rulesTitle;
      document.querySelector("#rules-caption").textContent = copy.rulesCaption;
      document.querySelector("#detail-title").textContent = copy.detailTitle;
      document.querySelector("#country-label").textContent = copy.country;
      document.querySelector("#query-label").textContent = copy.filter;
      queryInput.placeholder = copy.placeholder;
      document.querySelector("#compare-title").textContent = copy.compareTitle;
      document.querySelector("#compare-lede").textContent = copy.compareLede;
      const selectedId = countrySelect.value;
      countrySelect.innerHTML = COUNTRIES.map((country) => `<option value="${country.id}">${displayCountry(country)}</option>`).join("");
      countrySelect.value = selectedId || "benin";
      const rulesTable = document.querySelector("#rules");
      const rulesWrap = document.querySelector("#rules-wrap");
      rulesTable.innerHTML = table(
        copy.rulesHeaders,
      RULES.map((rule) => {
        const country = COUNTRIES.find((item) => item.id === rule.countryId);
          return [country ? displayCountry(country) : rule.countryId, rule.from, rule.to];
      }),
      []
    );
      const ruleRows = rulesTable.querySelectorAll("tbody tr");
      if (ruleRows.length > 10) {
        const top = rulesTable.getBoundingClientRect().top;
        const cut = ruleRows[10].getBoundingClientRect().top;
        rulesWrap.style.maxHeight = `${Math.ceil(cut - top)}px`;
      } else {
        rulesWrap.style.maxHeight = "";
      }
    document.querySelector("#overview").innerHTML = table(
        copy.compareHeaders,
        overview.map((item) => {
          const country = COUNTRIES.find((entry) => entry.name === item.name);
          return [country ? displayCountry(country) : item.name, String(item.dishes), String(item.labels), item.topName, String(item.topCount), item.share + "%"];
        }),
      [1, 2, 4, 5]
    );
    }

    function render() {
      const country = currentCountry();
      if (fileId !== "all" && !country.files.some((file) => file.id === fileId)) fileId = "all";
      const selected = selectionOf(country);
      const needle = queryInput.value.trim().toLowerCase();
      const groups = needle ? selected.groups.filter((group) => group.name.toLowerCase().includes(needle)) : selected.groups;
      const max = groups.reduce((n, group) => Math.max(n, group.count), 0) || 1;

      filesEl.innerHTML = "";
      if (country.files.length > 1) {
        const buttons = [{ id: "all", label: t().allFiles }].concat(country.files.map((file) => ({
          id: file.id,
          label: file.duplicateOf ? `${file.label} (${t().copy})` : file.raw ? `${file.label} (${t().raw})` : file.label,
        })));
        for (const button of buttons) {
          const el = document.createElement("button");
          el.className = "pill";
          el.type = "button";
          el.textContent = button.label;
          el.setAttribute("aria-pressed", String(fileId === button.id));
          el.addEventListener("click", () => { fileId = button.id; render(); });
          filesEl.appendChild(el);
        }
      }

      const active = country.files.find((file) => file.id === fileId);
      document.querySelector("#selection-meta").textContent = fileId === "all"
        ? t().metaAll(selected.dishes, selected.groups.length)
        : t().metaFile(active.file, active.sheet, selected.dishes);

      document.querySelector("#groups").innerHTML = table(
        t().groupHeaders,
        groups.map((group) => [
          group.name,
          String(group.count),
          pct(group.count, selected.dishes),
          `<div class="bar" style="width:${Math.round((100 * group.count) / max)}%"></div>`,
        ]),
        [1, 2]
      );
    }

    function setLang(next) {
      lang = next;
      try { localStorage.setItem("africuisine-lang", next); } catch (error) { /* private mode */ }
      paintChrome();
      render();
    }
    document.querySelector("#lang-fr").addEventListener("click", () => setLang("fr"));
    document.querySelector("#lang-en").addEventListener("click", () => setLang("en"));
    countrySelect.addEventListener("change", () => { fileId = "all"; render(); });
    queryInput.addEventListener("input", render);
    paintChrome();
    render();
  </script>
</body>
</html>
